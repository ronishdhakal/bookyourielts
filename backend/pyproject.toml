[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"apps/core/emailing.py" = ["E501"]  # inline-styled HTML

[tool.ruff.format]
quote-style = "double"
