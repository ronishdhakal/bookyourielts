# Local development: Postgres only. Run Django and Next.js on the host (see README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookyourielts
      POSTGRES_PASSWORD: bookyourielts
      POSTGRES_DB: bookyourielts
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookyourielts"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
