# Install as /etc/nginx/sites-enabled/bookyourielts.conf (copy byi-proxy.conf to /etc/nginx/).
# deploy.sh rewrites /etc/nginx/byi-upstreams.conf to point at the live colour, then reloads nginx.
# Cloudflare terminates public TLS; set Cloudflare SSL mode to "Full (strict)" with an origin certificate.
include /etc/nginx/byi-upstreams.conf;   # defines upstreams byi_backend and byi_frontend

server {
    listen 443 ssl http2;
    server_name bookyourielts.com www.bookyourielts.com;

    ssl_certificate     /etc/ssl/cloudflare/bookyourielts.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bookyourielts.key;

    # Trust the visitor IP only from Cloudflare: add its published ranges to cloudflare-ips.conf
    # as "set_real_ip_from <range>;" lines.
    real_ip_header CF-Connecting-IP;
    include /etc/nginx/cloudflare-ips.conf;

    client_max_body_size 12m;

    location ~ ^/(admin|django-static)/ {
        proxy_pass http://byi_backend;
        include /etc/nginx/byi-proxy.conf;
    }
    location /api/ {
        proxy_pass http://byi_backend;
        include /etc/nginx/byi-proxy.conf;
    }
    location = /healthz {
        proxy_pass http://byi_backend;
        include /etc/nginx/byi-proxy.conf;
    }
    location / {
        proxy_pass http://byi_frontend;
        include /etc/nginx/byi-proxy.conf;
    }
}
