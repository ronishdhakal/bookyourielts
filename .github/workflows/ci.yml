name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookyourielts
          POSTGRES_PASSWORD: bookyourielts
          POSTGRES_DB: bookyourielts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookyourielts" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      DATABASE_URL: postgres://bookyourielts:bookyourielts@localhost:5432/bookyourielts
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookyourielts
          POSTGRES_PASSWORD: bookyourielts
          POSTGRES_DB: bookyourielts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookyourielts" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      DATABASE_URL: postgres://bookyourielts:bookyourielts@localhost:5432/bookyourielts
      ADMIN_WHATSAPP_NUMBER: "9779812345678"
      API_ORIGIN: http://localhost:8000
      AUTH_RATE: 500/min
      INQUIRY_RATE: 500/hour
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements/dev.txt
      - name: Start API with demo data
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo --admin
          nohup gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break || sleep 1; done
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        working-directory: frontend
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Build and run Playwright
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright test
      - name: SEO audit
        working-directory: frontend
        run: |
          nohup npm run start -- -p 3100 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3100/robots.txt > /dev/null && break || sleep 1; done
          AUDIT_BASE=http://localhost:3100 AUDIT_SITE_URL=https://bookyourielts.com node scripts/seo-audit.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  deploy:
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
      - name: Deploy
        # Pulls the new code and runs the blue-green script. If the new version is not healthy the
        # script keeps the current one live and exits with an error, which fails this job.
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST }} \
            'cd /var/www/bookyourielts && git pull --ff-only && ./deploy/deploy.sh'
