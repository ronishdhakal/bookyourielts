name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookyourielts
          POSTGRES_PASSWORD: bookyourielts
          POSTGRES_DB: bookyourielts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookyourielts" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      DATABASE_URL: postgres://bookyourielts:bookyourielts@localhost:5432/bookyourielts
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookyourielts
          POSTGRES_PASSWORD: bookyourielts
          POSTGRES_DB: bookyourielts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookyourielts" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      DATABASE_URL: postgres://bookyourielts:bookyourielts@localhost:5432/bookyourielts
      ADMIN_WHATSAPP_NUMBER: "9779812345678"
      API_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements/dev.txt
      - name: Start API with demo data
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          nohup gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break || sleep 1; done
      - name: Build and run Playwright
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
